name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            src-tauri/target/
          key: windows-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: windows-cargo-

      - name: Install dependencies
        run: npm install

      - name: Set release version
        run: node -e "const fs=require('fs'); const path='src-tauri/tauri.conf.json'; const config=JSON.parse(fs.readFileSync(path, 'utf8')); config.version=process.env.GITHUB_REF_NAME.replace(/^v/, ''); fs.writeFileSync(path, JSON.stringify(config, null, 2) + String.fromCharCode(10));"

      - name: Build
        # Use npx directly — the npm 'tauri' script has a Unix PATH prefix
        # that does not work on Windows; cargo is already on PATH via dtolnay/rust-toolchain.
        run: npx tauri build

      - uses: actions/upload-artifact@v4
        with:
          name: markdown-slide-viewer-windows-${{ github.ref_name }}
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  build-macos:
    name: Build macOS
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            src-tauri/target/
          key: macos-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: macos-cargo-

      - name: Install dependencies
        run: npm install

      - name: Set release version
        run: node -e "const fs=require('fs'); const path='src-tauri/tauri.conf.json'; const config=JSON.parse(fs.readFileSync(path, 'utf8')); config.version=process.env.GITHUB_REF_NAME.replace(/^v/, ''); fs.writeFileSync(path, JSON.stringify(config, null, 2) + String.fromCharCode(10));"

      - name: Build
        run: npx tauri build

      - uses: actions/upload-artifact@v4
        with:
          name: markdown-slide-viewer-macos-${{ github.ref_name }}
          path: src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    needs:
      - build-windows
      - build-macos
    runs-on: ubuntu-latest

    steps:
      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: markdown-slide-viewer-windows-${{ github.ref_name }}
          path: release-assets/windows

      - name: Download macOS artifacts
        uses: actions/download-artifact@v4
        with:
          name: markdown-slide-viewer-macos-${{ github.ref_name }}
          path: release-assets/macos

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release-assets/windows/**
            release-assets/macos/**
