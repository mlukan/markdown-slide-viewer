name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh

    env:
      HAS_SIGNING_CERT: ${{ secrets.CODE_SIGNING_CERT_BASE64 != '' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            src-tauri/target/
          key: windows-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: windows-cargo-

      - name: Install dependencies
        run: npm install

      - name: Set release version
        run: node -e "const fs=require('fs'); const path='src-tauri/tauri.conf.json'; const config=JSON.parse(fs.readFileSync(path, 'utf8')); config.version=process.env.GITHUB_REF_NAME.replace(/^v/, ''); fs.writeFileSync(path, JSON.stringify(config, null, 2) + String.fromCharCode(10));"

      - name: Build
        # Use npx directly — the npm 'tauri' script has a Unix PATH prefix
        # that does not work on Windows; cargo is already on PATH via dtolnay/rust-toolchain.
        run: npx tauri build

      - name: Sign executables with signtool
        if: ${{ env.HAS_SIGNING_CERT == 'true' }}
        env:
          CERT_BASE64: ${{ secrets.CODE_SIGNING_CERT_BASE64 }}
          CERT_PASSWORD: ${{ secrets.CODE_SIGNING_CERT_PASSWORD }}
        run: |
          $filesToSign = Get-ChildItem -Path "src-tauri/target/release/bundle" -Include "*.msi", "*.exe" -File -Recurse
          if (-not $filesToSign) {
            throw "No .msi or .exe files found under src-tauri/target/release/bundle to sign."
          }
          Write-Host "Files to sign:"
          $filesToSign | ForEach-Object { Write-Host "  $($_.FullName)" }
          $certPath = "signing_cert.pfx"

          # Read secrets from env vars, not interpolated into the script text:
          # interpolating "${{ secrets.X }}" into a double-quoted PS string corrupts
          # values containing $, ` or " and risks script injection.
          $certBase64 = $env:CERT_BASE64
          if ([string]::IsNullOrWhiteSpace($certBase64)) {
            throw "CODE_SIGNING_CERT_BASE64 secret is empty."
          }
          $certBytes = [Convert]::FromBase64String($certBase64)
          $srcPassword = $env:CERT_PASSWORD

          # Load with .NET (handles modern OpenSSL 3 PBES2/AES PFX files that signtool cannot read),
          # then re-export in the legacy format signtool accepts.
          # EphemeralKeySet avoids writing to the user profile's key container, which is
          # not fully loaded on the runner and otherwise causes "Cannot find the requested object".
          $flags = [System.Security.Cryptography.X509Certificates.X509KeyStorageFlags]::Exportable -bor
                   [System.Security.Cryptography.X509Certificates.X509KeyStorageFlags]::EphemeralKeySet
          try {
            $cert = [System.Security.Cryptography.X509Certificates.X509Certificate2]::new($certBytes, $srcPassword, $flags)
          } catch {
            throw "Could not load the PFX: $($_.Exception.Message) — verify CODE_SIGNING_CERT_BASE64 is a base64-encoded .pfx and CODE_SIGNING_CERT_PASSWORD matches."
          }
          Write-Host "Certificate subject:    $($cert.Subject)"
          Write-Host "Certificate thumbprint: $($cert.Thumbprint)"
          Write-Host "Valid until:            $($cert.NotAfter)"
          if (-not $cert.HasPrivateKey) {
            throw "The certificate has no private key; export the .pfx including the private key."
          }

          $exportPassword = [Guid]::NewGuid().ToString("N")
          [IO.File]::WriteAllBytes($certPath, $cert.Export([System.Security.Cryptography.X509Certificates.X509ContentType]::Pkcs12, $exportPassword))

          # Find signtool (prefer the x64 SDK build over the App Certification Kit copy)
          function Find-SignTool {
            Get-ChildItem -Path "C:\Program Files (x86)\Windows Kits" -Filter "signtool.exe" -Recurse -ErrorAction SilentlyContinue |
              Sort-Object -Property @{ Expression = { if ($_.FullName -like '*\bin\*\x64\*') { 0 } else { 1 } } }, @{ Expression = { $_.FullName }; Descending = $true } |
              Select-Object -First 1
          }

          $signtoolPath = Find-SignTool

          if (-not $signtoolPath) {
            Write-Warning "signtool not found. Installing Windows SDK..."
            choco install windows-sdk-10.1 -y --no-progress
            $signtoolPath = Find-SignTool
          }

          if ($signtoolPath) {
            Write-Host "Using signtool at: $($signtoolPath.FullName)"
            foreach ($file in $filesToSign) {
              & $signtoolPath.FullName sign /f $certPath /p $exportPassword /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 $file.FullName
              if ($LASTEXITCODE -ne 0) {
                throw "signtool failed with exit code $LASTEXITCODE for $($file.FullName)"
              }
              & $signtoolPath.FullName verify /pa /v $file.FullName
              $verifyExitCode = $LASTEXITCODE
              if ($verifyExitCode -ne 0) {
                Write-Warning "Signature verification did not establish a trusted certificate chain (exit code $verifyExitCode). The file is signed, but the self-signed certificate is not trusted by this runner."
                $global:LASTEXITCODE = 0
              } else {
                Write-Host "Signature verified successfully for $($file.FullName)"
              }
              Write-Host "Successfully signed $($file.FullName)"
            }
          } else {
            Write-Warning "signtool not found. Proceeding without signing."
          }

      - name: Clean up certificate
        if: ${{ env.HAS_SIGNING_CERT == 'true' && always() }}
        run: |
          Remove-Item -Path "signing_cert.pfx" -ErrorAction SilentlyContinue
          Write-Host "Certificate cleaned up"

      - uses: actions/upload-artifact@v4
        with:
          name: markdown-slide-viewer-windows-${{ github.ref_name }}
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  build-macos:
    name: Build macOS
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            src-tauri/target/
          key: macos-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: macos-cargo-

      - name: Install dependencies
        run: npm install

      - name: Set release version
        run: node -e "const fs=require('fs'); const path='src-tauri/tauri.conf.json'; const config=JSON.parse(fs.readFileSync(path, 'utf8')); config.version=process.env.GITHUB_REF_NAME.replace(/^v/, ''); fs.writeFileSync(path, JSON.stringify(config, null, 2) + String.fromCharCode(10));"

      - name: Build
        run: npx tauri build

      - uses: actions/upload-artifact@v4
        with:
          name: markdown-slide-viewer-macos-${{ github.ref_name }}
          path: src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    needs:
      - build-windows
      - build-macos
    runs-on: ubuntu-latest

    steps:
      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: markdown-slide-viewer-windows-${{ github.ref_name }}
          path: release-assets/windows

      - name: Download macOS artifacts
        uses: actions/download-artifact@v4
        with:
          name: markdown-slide-viewer-macos-${{ github.ref_name }}
          path: release-assets/macos

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release-assets/windows/**
            release-assets/macos/**
